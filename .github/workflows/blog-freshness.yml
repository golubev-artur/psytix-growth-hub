name: Сторож выкладки блога

# Независимая проверка, что плановые выпуски вышли (пн/ср/пт, психология и продажи).
# Не пишет посты и не требует ключей - только читает blogData.ts.
# Если выпуск пропущен, job падает и GitHub присылает владельцу письмо о сбое.
# Падает каждый день, пока отставание не закрыто: тишина здесь значит «всё в порядке».

on:
  schedule:
    # 11:47 МСК ежедневно - после основного запуска расписания (07:00) и повторного (10:00).
    # Минута нарочно не круглая: на :00 и :30 у GitHub пик очереди, и плановые
    # запуски там опаздывали на 4-5 часов. Задержка всё равно возможна - сторож
    # срабатывает в тот же день, но не обязательно минута в минуту.
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Запас 4 часа: выпуск 07:00 считается сорванным только после 11:00,
      # когда уже отработал и повторный запуск
      - name: Проверить, что выпуски вышли
        run: node scripts/check-freshness.mjs --grace 4 --fail
